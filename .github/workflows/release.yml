name: 發布版本

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - run: cd client/dist && zip -r ../../bomberman-web-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bomberman-web-${{ github.ref_name }}.zip
